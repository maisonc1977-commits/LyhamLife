(function () {

    t('Migration d\'une sauvegarde v1 (jauges à plat, « argent »)', function () { var v1 = { saveVersion: 1, day: 12, min: 600, place: 'salon', faim: 33, energie: 120, argent: 42 }; var s = LL.migrate(v1); return { ok: s.g.faim === 33 && s.g.energie === 100 && s.money === 42 && s.saveVersion === LL.SAVE_VERSION && s.bacRevision && s.place === 'salon' }; });
    /* 12. Sauvegarde → rechargement */
    t('Sauvegarde → rechargement : état identique', function () { LL.S = LL.newState(); setTime(LL, '2027-03-10', 845); LL.S.place = 'jardin'; LL.S.money = 37; LL.S.rel.elynn = 88; LL.S.skills.danse = 140; LL.S.inv = { cupcake: 2, fleurs: 1 }; LL.S.events.ami_ep1 = 'done'; LL.S.settings.mus = 0.3; LL.S.settings.muted = true; LL.S.g.faim = 12.5; LL.save(); var snap = JSON.stringify(LL.S); LL.S = LL.newState(); LL.load(); var back = JSON.stringify(LL.S); return { ok: snap === back, detail: snap.length + ' octets' }; });
    LL.S.settings.muted = false; LL.audioVolumes();
    /* 3. Simulation automatique de 400 jours */
    var t0 = Date.now(), sim = { actions: 0, scenes: 0, interactions: 0, letters: 0, maxErr: null }, bad = [];
    LL.S = LL.newState(); LL.go('chambre', true);
    var rnd = LL.K.seeded(2026); function pick(a) { return a[Math.floor(rnd() * a.length)]; }
    for (var day = 0; day < 400; day++) {
      var start = LL.S.day, guard = 0;
      while (LL.S.day === start && guard++ < 14) {
        if (LL.S.min >= 1290) break;
        var accessible = Object.keys(LL.PLACES).filter(function (p) { return LL.canGo(p) === true; }); if (rnd() < 0.5) LL.go(pick(accessible));
        var acts = LL.actsHere().filter(function (a) { return a.ok === true && !(a.meta && (a.meta.ui || a.meta.id === 'chambre_dormir')); });
        if (acts.length) { var a = pick(acts); M.anim = null; M.dialogBusy = false; LL.act(a.i, a.meta.ask === 'tv' ? 1 + Math.floor(rnd() * 9) : a.meta.ask ? pick(['pates', 'omelette', 'crepes', 'patisserie']) : undefined); sim.actions++; LL.ui.close(); }
        if (M.npcs.length && rnd() < 0.4) { var np = pick(M.npcs), ks = LL.kindsFor(np.id).filter(function (k) { return k.ok === true; }); if (ks.length) { M.dialogBusy = false; LL.interact(np.id, pick(ks).k); sim.interactions++; LL.ui.close(); } }
        if (rnd() < 0.2) { var qs = LL.quizPick(null, 3); qs.forEach(function (q) { LL.quizAnswer(q, Math.floor(rnd() * 4)); }); }
        LL.checkStory(); LL.availableScenes().forEach(function (s) { LL.applyChoice(s, Math.floor(rnd() * s.choices.length)); sim.scenes++; });
        Object.keys(LL.S.events).filter(function (k) { return k.indexOf('daryl_') === 0 && LL.S.events[k] === 'available'; }).forEach(function (k) { LL.applyChoice(LL.storyById(k), 0); sim.scenes++; });
      }
      var nl = LL.lettresRecues(); for (var k = 1; k <= nl; k++) if (LL.S.lisa.replies['lisa_' + k] == null) { LL.repondreLisa(k, Math.floor(rnd() * 3)); sim.letters++; }
      if (LL.S.day === start) { LL.go('chambre', true); LL.S.min = Math.max(LL.S.min, 1260); LL.sleep(false); }
      var nan = []; deepNum(LL.S, 'S', nan); LL.GAUGES.forEach(function (g) { var v = LL.S.g[g]; if (!(v >= 0 && v <= 100)) bad.push('jour ' + day + ' jauge ' + g + '=' + v); }); Object.keys(LL.S.rel).forEach(function (r) { if (!(LL.S.rel[r] >= 0 && LL.S.rel[r] <= 100)) bad.push('lien ' + r); });
      if (nan.length) bad.push('jour ' + day + ' NaN : ' + nan.join(',')); if (bad.length > 5) break;
    }
    rec('Simulation de 400 jours : aucune exception, jauges 0–100, aucun NaN', !bad.length && !LL.errors.length && LL.S.day >= 400, 'jours=' + LL.S.day + ' (' + LL.dateTxt(LL.S.day) + ', ' + LL.niveau(LL.S.day) + ') ; actions=' + sim.actions + ' ; interactions=' + sim.interactions + ' ; scènes=' + sim.scenes + ' ; lettres=' + sim.letters + ' ; durée ' + Math.round((Date.now() - t0) / 1000) + ' s' + (bad.length ? ' ; ' + bad.slice(0, 5).join(' ; ') : '') + (LL.errors.length ? ' ; erreurs : ' + LL.errors.slice(0, 3).join(' ; ') : ''));
    rec('Aucune erreur JavaScript capturée pendant les tests', !LL.errors.length, LL.errors.join(' ; '));
    R.done = true; try { localStorage.removeItem(LL.SAVE_KEY); } catch (e) { }
    var out = document.getElementById('res'); out.innerHTML = '<b>' + R.pass + ' réussis, ' + R.fail + ' échoués</b>\n\n' + R.tests.map(function (x) { return '<span class="' + (x.ok ? 'ok' : 'ko') + '">' + (x.ok ? '✅' : '❌') + ' ' + x.name + '</span>' + (x.detail ? '\n    ' + x.detail.replace(/</g, '&lt;') : ''); }).join('\n');
  }
  document.addEventListener('DOMContentLoaded', function () { setTimeout(function () { run().catch(function (e) { rec('Lanceur', false, String(e && e.stack || e)); R.done = true; document.getElementById('res').textContent = 'ERREUR : ' + e; }); }, 300); });
})();
</script>
